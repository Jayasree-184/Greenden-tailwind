<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenden Admin Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <header class="bg-green-700 text-white shadow">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Greenden Admin</h1>
                <p class="text-green-100 text-sm">
                    Contact & Newsletter Database
                </p>
            </div>

            <button
                onclick="loadData()"
                class="bg-white text-green-700 px-4 py-2 rounded-lg font-semibold hover:bg-green-50 transition">
                Refresh
            </button>
        </div>
    </header>


    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

            <div class="bg-white rounded-xl shadow p-6">
                <p class="text-gray-500 text-sm">Total Contacts</p>
                <h2 id="contactCount"
                    class="text-3xl font-bold text-green-700 mt-2">
                    0
                </h2>
            </div>

            <div class="bg-white rounded-xl shadow p-6">
                <p class="text-gray-500 text-sm">Newsletter Subscribers</p>
                <h2 id="newsletterCount"
                    class="text-3xl font-bold text-green-700 mt-2">
                    0
                </h2>
            </div>

        </div>


        <!-- Contact Submissions -->
        <section class="bg-white rounded-xl shadow mb-10 overflow-hidden">

            <div class="px-6 py-5 border-b">
                <h2 class="text-xl font-bold">
                    Contact Submissions
                </h2>
                <p class="text-sm text-gray-500 mt-1">
                    Messages submitted through the contact form
                </p>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold">ID</th>
                            <th class="px-6 py-4 text-sm font-semibold">Name</th>
                            <th class="px-6 py-4 text-sm font-semibold">Email</th>
                            <th class="px-6 py-4 text-sm font-semibold">Message</th>
                            <th class="px-6 py-4 text-sm font-semibold">Date</th>
                            <th class="px-6 py-4 text-sm font-semibold">Action</th>
                        </tr>
                    </thead>

                    <tbody id="contactTable">
                        <tr>
                            <td colspan="6"
                                class="px-6 py-8 text-center text-gray-500">
                                Loading...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </section>


        <!-- Newsletter Subscribers -->
        <section class="bg-white rounded-xl shadow overflow-hidden">

            <div class="px-6 py-5 border-b">
                <h2 class="text-xl font-bold">
                    Newsletter Subscribers
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    People subscribed to your newsletter
                </p>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold">ID</th>
                            <th class="px-6 py-4 text-sm font-semibold">Email</th>
                            <th class="px-6 py-4 text-sm font-semibold">Date</th>
                            <th class="px-6 py-4 text-sm font-semibold">Action</th>
                        </tr>
                    </thead>

                    <tbody id="newsletterTable">
                        <tr>
                            <td colspan="4"
                                class="px-6 py-8 text-center text-gray-500">
                                Loading...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </section>

    </main>


    <script>

        // Use relative API path so requests go to whichever host is serving
        // the admin page (localhost:4000 locally or Render in production).
        const API_BASE = '';


        // Escape HTML to prevent database content
        // from being interpreted as HTML.
        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        // Load everything
        async function loadData() {

            try {

                const [contactsResponse, newsletterResponse] =
                    await Promise.all([
                        fetch(`${API_BASE}/api/contact`),
                        fetch(`${API_BASE}/api/newsletter`)
                    ]);


                if (!contactsResponse.ok) {
                    throw new Error('Could not load contacts');
                }

                if (!newsletterResponse.ok) {
                    throw new Error('Could not load newsletter subscribers');
                }


                const contacts = await contactsResponse.json();
                const subscribers = await newsletterResponse.json();


                displayContacts(contacts);
                displayNewsletter(subscribers);


                document.getElementById('contactCount').textContent =
                    contacts.length;

                document.getElementById('newsletterCount').textContent =
                    subscribers.length;


            } catch (error) {

                console.error(error);

                document.getElementById('contactTable').innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="px-6 py-8 text-center text-red-500">
                            Failed to load contact records.
                        </td>
                    </tr>
                `;

                document.getElementById('newsletterTable').innerHTML = `
                    <tr>
                        <td colspan="4"
                            class="px-6 py-8 text-center text-red-500">
                            Failed to load newsletter records.
                        </td>
                    </tr>
                `;

            }

        }


        // Display contacts
        function displayContacts(contacts) {

            const table = document.getElementById('contactTable');


            if (!contacts.length) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="px-6 py-8 text-center text-gray-500">
                            No contact submissions yet.
                        </td>
                    </tr>
                `;

                return;
            }


            table.innerHTML = contacts.map(contact => `

                <tr class="border-b hover:bg-gray-50">

                    <td class="px-6 py-4">
                        ${escapeHTML(contact.id)}
                    </td>

                    <td class="px-6 py-4 font-medium">
                        ${escapeHTML(contact.name)}
                    </td>

                    <td class="px-6 py-4">
                        ${escapeHTML(contact.email)}
                    </td>

                    <td class="px-6 py-4 max-w-md">
                        <p class="truncate"
                           title="${escapeHTML(contact.message)}">
                            ${escapeHTML(contact.message)}
                        </p>
                    </td>

                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${escapeHTML(
                            contact.created_at ||
                            contact.createdAt ||
                            ''
                        )}
                    </td>

                    <td class="px-6 py-4">

                        <button
                            onclick="deleteContact(${contact.id})"
                            class="bg-red-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-600">
                            Delete
                        </button>

                    </td>

                </tr>

            `).join('');

        }


        // Display newsletter subscribers
        function displayNewsletter(subscribers) {

            const table = document.getElementById('newsletterTable');


            if (!subscribers.length) {

                table.innerHTML = `
                    <tr>
                        <td colspan="4"
                            class="px-6 py-8 text-center text-gray-500">
                            No newsletter subscribers yet.
                        </td>
                    </tr>
                `;

                return;
            }


            table.innerHTML = subscribers.map(subscriber => `

                <tr class="border-b hover:bg-gray-50">

                    <td class="px-6 py-4">
                        ${escapeHTML(subscriber.id)}
                    </td>

                    <td class="px-6 py-4 font-medium">
                        ${escapeHTML(subscriber.email)}
                    </td>

                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${escapeHTML(
                            subscriber.created_at ||
                            subscriber.createdAt ||
                            ''
                        )}
                    </td>

                    <td class="px-6 py-4">

                        <button
                            onclick="deleteSubscriber(${subscriber.id})"
                            class="bg-red-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-600">
                            Delete
                        </button>

                    </td>

                </tr>

            `).join('');

        }


        // Delete contact
        async function deleteContact(id) {

            if (!confirm('Delete this contact submission?')) {
                return;
            }


            try {

                const response = await fetch(
                    `${API_BASE}/api/contact/${id}`,
                    {
                        method: 'DELETE'
                    }
                );


                if (!response.ok) {
                    throw new Error('Delete failed');
                }


                await loadData();


            } catch (error) {

                alert('Could not delete contact.');

                console.error(error);

            }

        }


        // Delete newsletter subscriber
        async function deleteSubscriber(id) {

            if (!confirm('Delete this subscriber?')) {
                return;
            }


            try {

                const response = await fetch(
                    `${API_BASE}/api/newsletter/${id}`,
                    {
                        method: 'DELETE'
                    }
                );


                if (!response.ok) {
                    throw new Error('Delete failed');
                }


                await loadData();


            } catch (error) {

                alert('Could not delete subscriber.');

                console.error(error);

            }

        }


        // Load data when page opens
        loadData();

    </script>

</body>
</html>
